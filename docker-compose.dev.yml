# Self-contained browser development. No .env, real Telegram token, bot or SQLite import.
name: hikari-miniapp-dev

x-backend-env: &backend-env
  APP_ENV: development
  DATABASE_URL: postgres://hikari_dev:local_dev_only@database:5432/hikari_dev?sslmode=disable
  TELEGRAM_BOT_TOKEN: local-miniapp-only-not-a-telegram-token
  ADMIN_TELEGRAM_IDS: '123456789'
  BOT_SERVICE_TOKEN: local-dev-service-not-for-production
  TARGETS_PATH: /app/targets.json

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hikari_dev
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: hikari_dev
    ports: ['127.0.0.1:55439:5432']
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hikari_dev -d hikari_dev']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: hikari-miniapp-dev-backend:local
    environment: *backend-env
    entrypoint: ['/app/migrate']
    depends_on:
      database: {condition: service_healthy}
    restart: 'no'

  seed:
    image: postgres:18-alpine
    environment:
      PGHOST: database
      PGUSER: hikari_dev
      PGPASSWORD: local_dev_only
      PGDATABASE: hikari_dev
    entrypoint: ['psql', '-v', 'ON_ERROR_STOP=1', '-f', '/seed.sql']
    volumes: ['./miniapp/dev/seed.sql:/seed.sql:ro']
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: 'no'

  backend:
    image: hikari-miniapp-dev-backend:local
    build: ./backend
    environment: *backend-env
    volumes: ['./miniapp/dev/targets.json:/app/targets.json:ro', 'media:/app/data']
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:8080/healthz']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  gateway:
    image: node:24-alpine
    user: node
    read_only: true
    environment:
      APP_ENV: development
      BACKEND_URL: http://backend:8080
    command: ['node', '/app/gateway.mjs']
    volumes: ['./miniapp/dev/gateway.mjs:/app/gateway.mjs:ro']
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

  miniapp:
    build: ./miniapp
    ports: ['127.0.0.1:5173:80']
    volumes: ['./miniapp/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [gateway]
    restart: unless-stopped

volumes:
  postgres_data:
  media:
