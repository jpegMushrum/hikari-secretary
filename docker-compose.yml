name: hikari-secretary

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-migrate:
    image: hikari-secretary-backend:local
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    entrypoint: ["/app/migrate"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend-import:
    image: hikari-secretary-backend:local
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'exec /app/import-legacy --sqlite /legacy/bot.sqlite3 --apply --json --database-url "$$DATABASE_URL"'
    volumes:
      - ${BOT_DATA_DIR:-./data}:/legacy:ro
    depends_on:
      database:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    image: hikari-secretary-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-90}
      AI_TOPIC_TARGET_KEY: ${AI_TOPIC_TARGET_KEY:-}
      AI_TOPIC_AUTO_PUBLISH_TIME: ${AI_TOPIC_AUTO_PUBLISH_TIME:-}
      AI_TOPIC_QUESTION_COUNT: ${AI_TOPIC_QUESTION_COUNT:-5}
      AI_TOPIC_VOCABULARY_COUNT: ${AI_TOPIC_VOCABULARY_COUNT:-10}
      AI_TOPIC_GRAMMAR_COUNT: ${AI_TOPIC_GRAMMAR_COUNT:-3}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      TARGETS_PATH: /app/targets.json
    volumes:
      - ${BOT_TARGETS_FILE:-./targets.json}:/app/targets.json:ro
    depends_on:
      database:
        condition: service_healthy
      backend-import:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file:
      - ${BOT_ENV_FILE:-./.env}
    environment:
      BACKEND_URL: http://backend:8080
    volumes:
      - ${BOT_DATA_DIR:-./data}:/app/data
      - ${BOT_TARGETS_FILE:-./targets.json}:/app/targets.json:ro
    depends_on:
      backend:
        condition: service_healthy
      backend-import:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
