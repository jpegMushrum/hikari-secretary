# Standalone stack; run with docker compose -f docker-compose.bot-local.yml up -d --build
name: hikari-miniapp-dev
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hikari_dev
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: hikari_dev
    ports:
    - 127.0.0.1:55439:5432
    volumes:
    - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U hikari_dev -d hikari_dev
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: hikari-miniapp-dev-backend:local
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://hikari_dev:local_dev_only@database:5432/hikari_dev?sslmode=disable
      TELEGRAM_BOT_TOKEN: local-miniapp-only-not-a-telegram-token
      ADMIN_TELEGRAM_IDS: '123456789'
      BOT_SERVICE_TOKEN: local-dev-service-not-for-production
      TARGETS_PATH: /app/targets.json
    entrypoint:
    - /app/migrate
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'
  backend:
    image: hikari-miniapp-dev-backend:local
    build: ./backend
    environment:
      APP_ENV: development
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-90}
      AI_TOPIC_TARGET_KEY: ${AI_TOPIC_TARGET_KEY:-}
      AI_TOPIC_AUTO_PUBLISH_TIME: ${AI_TOPIC_AUTO_PUBLISH_TIME:-}
      AI_TOPIC_QUESTION_COUNT: ${AI_TOPIC_QUESTION_COUNT:-5}
      AI_TOPIC_VOCABULARY_COUNT: ${AI_TOPIC_VOCABULARY_COUNT:-10}
      AI_TOPIC_GRAMMAR_COUNT: ${AI_TOPIC_GRAMMAR_COUNT:-3}
      AI_TOPIC_MAX_ATTEMPTS: ${AI_TOPIC_MAX_ATTEMPTS:-5}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      REMINDER_OPTIONS_MINUTES: ${REMINDER_OPTIONS_MINUTES:-30,60,120,360,1440}
      DATABASE_URL: postgres://hikari_dev:local_dev_only@database:5432/hikari_dev?sslmode=disable
      TELEGRAM_BOT_TOKEN: local-miniapp-only-not-a-telegram-token
      ADMIN_TELEGRAM_IDS: '123456789'
      BOT_SERVICE_TOKEN: local-dev-service-not-for-production
      TARGETS_PATH: /app/targets.json
    volumes:
    - ./targets.json:/app/targets.json:ro
    - media:/app/data
    - ./data/media:/app/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider -q http://127.0.0.1:8080/healthz
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  gateway:
    image: node:24-alpine
    user: node
    read_only: true
    environment:
      APP_ENV: development
      BACKEND_URL: http://backend:8080
    command:
    - node
    - /app/gateway.mjs
    volumes:
    - ./miniapp/dev/gateway.mjs:/app/gateway.mjs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  miniapp:
    build: ./miniapp
    ports:
    - 127.0.0.1:5173:80
    volumes:
    - ./miniapp/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - gateway
    restart: unless-stopped
  bot:
    build: ./bot
    env_file: ./.env
    environment:
      BACKEND_URL: http://backend:8080
      BOT_SERVICE_TOKEN: local-dev-service-not-for-production
      MEDIA_DIR: /app/data/media
      TARGETS_PATH: /app/targets.json
      APP_ENV: development
      MINIAPP_URL: http://localhost:5173
    volumes:
    - ./targets.json:/app/targets.json:ro
    - ./data/media:/app/data/media
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data: null
  media: null
