# Overlay for the real TEST bot and a copy of the imported local database.
# docker compose -f docker-compose.dev.yml -f docker-compose.bot-local.yml up -d --build
services:
  migrate:
    environment:
      DATABASE_URL: postgres://hikari_dev:local_dev_only@database:5432/hikari_bot_local_20261117?sslmode=disable
  seed:
    entrypoint: ['true']
  backend:
    environment:
      DATABASE_URL: postgres://hikari_dev:local_dev_only@database:5432/hikari_bot_local_20261117?sslmode=disable
    volumes:
      - ./targets.json:/app/targets.json:ro
      - ./data/media:/app/data/media
  bot:
    build: ./bot
    env_file: ./.env
    environment:
      BACKEND_URL: http://backend:8080
      BOT_SERVICE_TOKEN: local-dev-service-not-for-production
      MEDIA_DIR: /app/data/media
      TARGETS_PATH: /app/targets.json
      MINIAPP_URL: ''
      BOT_BACKGROUND_WORKERS_ENABLED: 'true'
      AI_TOPIC_AUTO_PUBLISH_TIME: ''
      AI_TOPIC_TARGET_KEY: ''
    volumes:
      - ./targets.json:/app/targets.json:ro
      - ./data/media:/app/data/media
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
