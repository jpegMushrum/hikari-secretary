name: Deploy production

on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Только собрать и опубликовать образы (без подключения к VPS)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  queue: max

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  images:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.publish.outputs.backend }}
      bot: ${{ steps.publish.outputs.bot }}
      miniapp: ${{ steps.publish.outputs.miniapp }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Sign in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish release images
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          for component in backend bot miniapp; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$component"
            metadata="$RUNNER_TEMP/$component-metadata.json"
            docker buildx build --platform linux/amd64 \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --metadata-file "$metadata" --push --tag "$image:$GITHUB_SHA" "$component"
            digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")
            printf '%s=%s@%s\n' "$component" "$image" "$digest" >> "$GITHUB_OUTPUT"
            printf -- '- %s@%s\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy:
    if: ${{ !inputs.publish_only }}
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install verified release on the server
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          BACKEND_IMAGE: ${{ needs.images.outputs.backend }}
          BOT_IMAGE: ${{ needs.images.outputs.bot }}
          MINIAPP_IMAGE: ${{ needs.images.outputs.miniapp }}
          PRODUCTION_ACTION: release
        run: bash deploy/production-ssh.sh
