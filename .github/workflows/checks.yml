name: Platform checks

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend / PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hikari
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: hikari_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U hikari -d hikari_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Unit and PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://hikari:ci-only@127.0.0.1:${{ job.services.database.ports['5432'] }}/hikari_test?sslmode=disable
        run: go test -count=1 -tags=integration ./...

  miniapp:
    name: Miniapp / tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:gateway
      - run: npm run build

  python:
    name: Bot / deployment tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: python -m pip install -r bot/requirements.txt
      - name: Bot unit tests
        working-directory: bot
        run: python -m unittest discover -s tests -v
      - name: Compose and SQLite snapshot tests
        run: python -m unittest discover -s deploy -v
